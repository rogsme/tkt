name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          # The race detector needs cgo; without a C compiler, test without it.
          if command -v gcc >/dev/null; then
            go test -race ./...
          else
            go test ./...
          fi

      - name: Shellcheck install.sh
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck install.sh

      - name: Build every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null .
          done

      - name: Build every release target with pi inside
        run: |
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          # fetch checks each tarball against internal/pi/pi.lock.
          go run ./internal/pi/fetch $targets
          for target in $targets; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -tags bundled_pi -trimpath -o /dev/null .
          done

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the pi extension
        # Node strips the TypeScript types itself; the tested files import
        # nothing from pi. Node 24 reads a directory here as a module, so
        # the glob names the files.
        run: node --test 'internal/pi/ext/test/*.test.ts'

      - name: No en or em dashes
        run: |
          # Bytes, not characters: in the C locale git grep cannot read
          # \x{2014}, and an error must not pass as no match.
          status=0
          LC_ALL=C git grep -nP '\xE2\x80[\x93\x94]' || status=$?
          if [ "$status" -ne 1 ]; then
            echo "rewrite the lines above without dashes"
            exit 1
          fi
