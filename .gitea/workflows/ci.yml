name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck bsdextrautils

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Shellcheck
        run: shellcheck -x bin/tests/run bin/tests/*.sh bin/tests/fakes/*

      - name: Black-box tests
        run: |
          dir=$(mktemp -d)
          go build -race -o "$dir/tkt" .
          TKT_BIN="$dir/tkt" bash bin/tests/run

      - name: Build every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null .
          done
